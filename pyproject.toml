[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clirec"
version = "0.3.0"
description = "Human-readable GUI demonstration recordings for CLI and agent workflows."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "The clirec authors"},
]
keywords = [
    "gui-automation", "recording", "replay", "cli", "agent-workflow",
    "computer-use", "demonstration", "local-first",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
record = ["pynput>=1.7"]
audio = ["sounddevice>=0.5"]
uia = ["uiautomation>=2.0; sys_platform == 'win32'"]
dev = ["build>=1.2", "pytest>=7.0", "ruff>=0.12", "twine>=6.1"]
all = ["pynput>=1.7", "sounddevice>=0.5", "uiautomation>=2.0; sys_platform == 'win32'"]

[project.scripts]
clirec = "clirec.cli:main"

[project.urls]
Homepage = "https://github.com/ellmos-ai/clirec"
Repository = "https://github.com/ellmos-ai/clirec"
Changelog = "https://github.com/ellmos-ai/clirec/blob/main/CHANGELOG.md"
Issues = "https://github.com/ellmos-ai/clirec/issues"
"LLM Context" = "https://github.com/ellmos-ai/clirec/blob/main/llms.txt"

[tool.setuptools.packages.find]
include = ["clirec*"]

[tool.pytest.ini_options]
addopts = "-ra -v"
pythonpath = "."
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Pin the rule set explicitly. ruff's default rule set widens between
# releases, and CI installs an unpinned `ruff>=0.12`, so a new ruff can turn
# a green build red without any code change -- which is exactly what happened
# on 2026-07-24 when CI pulled ruff 0.16 and reported 39 findings (BLE001,
# S110, SIM115, UP037, ...) that were never part of this project's standard.
# Widening this list is a deliberate decision, not a side effect of an upgrade.
select = ["E", "F", "W", "B", "C4"]
