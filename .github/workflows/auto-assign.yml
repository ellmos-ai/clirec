name: 'Auto-assign PRs'

on:
  pull_request_target:
    types: [opened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  issues: write
  pull-requests: write

jobs:
  assign:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PR_ASSIGNEE: ${{ vars.CLIREC_PR_ASSIGNEE || 'lukisch' }}
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr_number = context.payload.pull_request.number;

            const assignee = process.env.PR_ASSIGNEE?.trim();
            if (!assignee) {
              core.setFailed('PR_ASSIGNEE is not configured.');
              return;
            }

            const { data } = await github.rest.issues.addAssignees({
              owner,
              repo,
              issue_number: pr_number,
              assignees: [assignee]
            });

            const assigned = Array.isArray(data.assignees) && data.assignees.some(
              ({ login }) => login.toLowerCase() === assignee.toLowerCase()
            );
            if (!assigned) {
              core.setFailed(`GitHub did not apply requested PR assignee: ${assignee}`);
              return;
            }
